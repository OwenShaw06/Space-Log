<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Low Orbit">
<meta name="format-detection" content="telephone=no">
<title>Low Orbit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>setTimeout(function(){document.documentElement.classList.remove('booting')},6000)</script>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="sky" aria-hidden="true"></div>
<div class="wrap">
  <section id="hero" aria-label="Station viewport">
    <div class="scenes" aria-hidden="true"></div>
    <div class="hud">
      <p class="h tl"><span id="hud-sector">SECTOR 01 · CONSOLE</span><br><span id="hud-flavor" class="dim"></span></p>
      <p class="h tr" id="status"></p>
      <div class="ttl">
        <p class="cs">CALLSIGN</p>
        <h1 id="stname">Low Orbit</h1>
      </div>
      <p class="h br"><span id="hud-clock"></span></p>
    </div>
  </section>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav id="tabs" aria-label="Sections">
  <button type="button" data-act="tab" data-tab="console">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M3.5 9h17M9 9v10.5"/></svg>
    <span>Console</span>
  </button>
  <button type="button" data-act="tab" data-tab="log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M9 10h6M9 14h4"/></svg>
    <span>Log</span>
  </button>
  <button type="button" data-act="tab" data-tab="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><ellipse cx="12" cy="12" rx="9.5" ry="4.2" transform="rotate(-28 12 12)"/></svg>
    <span>Plan</span>
  </button>
  <button type="button" data-act="tab" data-tab="progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4.5 3 3L19 7"/></svg>
    <span>Progress</span>
  </button>
  <button type="button" data-act="tab" data-tab="goals">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
    <span>Goals</span>
  </button>
</nav>

<div id="boot" hidden aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
